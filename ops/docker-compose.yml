version: "3.9"

services:
  middleware:
    build:
      context: ../middleware
    env_file:
      - ../.env
    ports:
      - "8787:8787"
    restart: unless-stopped

  relayer:
    build:
      context: ../relayer
    env_file:
      - ../.env
    ports:
      - "8788:8788"
    restart: unless-stopped

  indexer:
    build:
      context: ../indexer
    env_file:
      - ../.env
    volumes:
      - indexer-data:/data
    restart: unless-stopped

  oracle-agent:
    build:
      context: ../oracle-agent
    env_file:
      - ../.env
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        VITE_MIDDLEWARE_URL: ${VITE_MIDDLEWARE_URL:-http://localhost:8787}
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  indexer-data:
