name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Cairo
      uses: software-mansion/setup-scarb@v1
      with:
        scarb-version: "2.8.0"
    
    - name: Setup Starknet Foundry
      uses: foundry-rs/starknet-foundry@v0.3.1
      with:
        snforge-version: "0.18.0"
    
    - name: Install Scarb dependencies
      working-directory: contracts
      run: |
        scarb update
        scarb build
    
    - name: Run tests
      working-directory: contracts
      run: |
        scarb test
    
    - name: Check formatting
      working-directory: contracts
      run: |
        scarb fmt --check
