name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - name: Setup Scarb
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.8.0"

      - name: Setup Starknet Foundry (snforge)
        uses: foundry-rs/setup-snfoundry@v4
        # Optional: pin a tool version; otherwise it uses latest or .tool-versions if present
        # with:
        #   starknet-foundry-version: "0.18.0"

      - name: Cache Scarb
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/scarb
            contracts/target
          key: ${{ runner.os }}-scarb-${{ hashFiles('contracts/Scarb.lock', 'contracts/Scarb.toml') }}
          restore-keys: |
            ${{ runner.os }}-scarb-

      - name: Show tool versions
        run: |
          scarb --version
          snforge --version

      - name: Build
        run: |
          scarb update
          scarb build

      - name: Test
        run: |
          snforge test

      - name: Format check
        run: |
          scarb fmt --check
